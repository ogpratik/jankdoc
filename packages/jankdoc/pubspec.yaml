name: jankdoc
description: >
  A Flutter DevTools extension that diagnoses jank at the code level.
  Local-first — powered by Ollama. Zero data egress.
version: 1.0.0
homepage: https://jankdoc.dev
repository: https://github.com/ogpratik/jankdoc

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  jankdoc_core:
    path: ../jankdoc_core
  jankdoc_rules:
    path: ../jankdoc_rules

  # HTTP server (daemon)
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # HTTP client (daemon → Ollama)
  http: ^1.2.0

  # SQLite cross-session memory
  sqlite3: ^2.4.3
  sqlite3_flutter_libs: ^0.5.22

  # UUID generation for diagnosis IDs
  uuid: ^4.4.0

  # CLI argument parsing for bin/daemon.dart
  args: ^2.5.0

  # Vector store JSON persistence
  path_provider: ^2.1.4

  # VM Service client — used by TelemetryCollector to capture CPU samples
  # and device info. Transitively provided by devtools_extensions, but we
  # declare it explicitly so the version is pinned.
  vm_service: ^14.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  test: ^1.25.0

executables:
  jankdoc_daemon: daemon

flutter:
  plugin:
    platforms:
      any: {}
