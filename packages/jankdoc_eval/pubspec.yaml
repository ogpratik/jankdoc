name: jankdoc_eval
description: >
  Evaluation harness for JankDoc's diagnostic pipeline.
  Measures rule hit-rate, LLM accuracy, retrieval quality, and latency.
  Runs in pure Dart — no Flutter, no device needed.
version: 1.0.0-beta.1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  jankdoc_core:
    path: ../jankdoc_core
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
