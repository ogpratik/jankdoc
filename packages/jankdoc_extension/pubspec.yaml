name: jankdoc_extension
description: JankDoc DevTools extension — the Flutter web UI.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  devtools_extensions: ^0.5.0
  devtools_app_shared: ^0.5.0
  jankdoc_core:
    path: ../jankdoc_core
  http: ^1.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^5.0.0
